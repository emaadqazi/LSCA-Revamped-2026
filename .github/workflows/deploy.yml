name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so past events move into "Past events" on their own.
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 4–5am in Waterloo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          # The Astro project lives at the repo root.
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
