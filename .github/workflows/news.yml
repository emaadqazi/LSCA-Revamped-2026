name: Weekly industry news

# Every Monday morning: read the trade-press feeds, have Claude pick and summarize five stories,
# commit them to src/content/news/weekly.json and redeploy. Run it by hand from the Actions tab to
# refresh the current week's picks (they are replaced, not added to).
on:
  schedule:
    - cron: '0 11 * * 1' # 11:00 UTC = 6–7am in Waterloo
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick this week's stories
        run: node scripts/fetch-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content/news/weekly.json; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/news/weekly.json
          git commit -m "Industry news: picks for the week of $(date -u +%Y-%m-%d)"
          git push
          # Pushes made with the workflow token don't trigger the deploy workflow, so start it directly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
